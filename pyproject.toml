[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shanghai-strategy-lab"
version = "0.1.0"
description = "Local, explainable Shanghai A-share strategy research"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4", "pandas==2.2.3", "plotly==5.24.1", "matplotlib==3.10.7",
  "streamlit==1.55.0", "pydantic==2.12.3", "pyarrow==23.0.1",
  "PyYAML==6.0.1", "akshare==1.18.62", "baostock==0.9.3", "psutil==7.1.2", "filelock==3.20.0"
]

[project.optional-dependencies]
test = ["pytest==9.0.3"]

[tool.setuptools.packages.find]
include = ["lab*"]

[tool.setuptools.package-data]
lab = ["resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
